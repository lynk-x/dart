<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href is replaced by Flutter's build tooling. The trailing slash is required.
    For more details: https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <script>
    // Accessibility: Prevent Flutter from disabling zooming/scaling
    // Flutter Web engine often injects a viewport meta tag with 'user-scalable=no'.
    // This observer intercepts it and forces it to allow scaling.
    (function() {
      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.nodeName === 'META' && (node.name === 'viewport' || node.getAttribute('flt-viewport') !== null)) {
              if (node.content.includes('user-scalable=no')) {
                node.content = node.content.replace('user-scalable=no', 'user-scalable=yes');
              }
              if (!node.content.includes('user-scalable')) {
                node.content += ', user-scalable=yes';
              }
            }
          }
        }
      });
      observer.observe(document.head, { childList: true });
    })();
  </script>

  <!-- SEO -->
  <title>Lynk-X — Discover &amp; Attend Events</title>
  <meta name="description" content="Lynk-X is the ultimate event app. Discover, purchase tickets, and connect with your community through unforgettable live events.">
  <meta name="keywords" content="events, tickets, live events, event discovery, lynk-x">

  <!-- PWA: Theme & Display -->
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/images/official_lynk-x_combined-logo.svg" as="image" type="image/svg+xml">


  <!-- PWA: iOS / Safari specific -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lynk-X">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-maskable-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">

  <!-- Open Graph (for sharing links) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lynk-X — Discover &amp; Attend Events">
  <meta property="og:description" content="The ultimate event app. Discover, purchase tickets, and connect with your community.">
  <meta property="og:image" content="icons/Icon-512.png">

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #000000;
      transition: opacity 0.5s ease-out;
    }
    .loader {
      width: 50px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid;
      border-color: #20F928 #0000;
      animation: l1 1s infinite;
    }
    @keyframes l1 {to{transform: rotate(.5turn)}}
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <span class="loader"></span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.lynkWebAuthn = {
      isSupported: async function() {
        try {
          return window.PublicKeyCredential && 
            await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        } catch (e) {
          return false;
        }
      },

      registerLocalCredential: async function(username) {
        try {
          const isAvailable = await this.isSupported();
          if (!isAvailable) throw new Error("Platform authenticator not available");

          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16);
          window.crypto.getRandomValues(userId);

          const options = {
            publicKey: {
              challenge: challenge,
              rp: {
                name: "Lynk-X PWA",
                id: window.location.hostname
              },
              user: {
                id: userId,
                name: username || "user@lynk-x",
                displayName: username || "Lynk-X User"
              },
              pubKeyCredParams: [
                { alg: -7, type: "public-key" },
                { alg: -257, type: "public-key" }
              ],
              authenticatorSelection: {
                authenticatorAttachment: "platform",
                userVerification: "required"
              },
              timeout: 60000
            }
          };

          const credential = await navigator.credentials.create(options);
          if (!credential) throw new Error("Credential creation failed");

          const rawId = new Uint8Array(credential.rawId);
          const hexId = Array.from(rawId).map(b => b.toString(16).padStart(2, '0')).join('');
          return hexId;
        } catch (e) {
          console.error("[WebAuthn Register Error]:", e);
          return null;
        }
      },

      authenticateLocalCredential: async function(hexId) {
        try {
          const isAvailable = await this.isSupported();
          if (!isAvailable) throw new Error("Platform authenticator not available");

          const rawId = new Uint8Array(hexId.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);

          const options = {
            publicKey: {
              challenge: challenge,
              allowCredentials: [{
                id: rawId,
                type: "public-key"
              }],
              userVerification: "required",
              timeout: 60000
            }
          };

          const assertion = await navigator.credentials.get(options);
          if (!assertion) throw new Error("Assertion failed");
          return true;
        } catch (e) {
          console.error("[WebAuthn Auth Error]:", e);
          return false;
        }
      }
    };

    const loading = document.getElementById('loading');
    
    function removeLoader() {
      if (!loading) return;
      loading.style.opacity = '0';
      setTimeout(() => {
        if (loading.parentNode) loading.remove();
      }, 400);
    }

    // 1. Proactive: Watch for Flutter's rendering pane to appear in the DOM
    const observer = new MutationObserver((mutations, obs) => {
      if (document.querySelector('flt-glass-pane')) {
        removeLoader();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 2. Event-based: Standard Flutter signal
    window.addEventListener('flutter-first-frame', removeLoader);

    // 3. Fallback: If everything else fails (e.g. script error), clear it
    setTimeout(removeLoader, 8000);

    // ── Service Worker Registration ──────────────────────────────────────────
    // Registers the Workbox-generated service-worker.js for offline caching
    // and the firebase-messaging-sw.js for background push notifications.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // 1. Main SW (Workbox — handles offline caching & app shell)
        navigator.serviceWorker.register('/service-worker.js').then((reg) => {
          console.log('[SW] Registered:', reg.scope);

          // Detect when a new service worker is available (new deploy)
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                // New version is ready — show a non-intrusive update prompt.
                // We don't force-reload because the user might be mid-chat.
                const banner = document.createElement('div');
                banner.id = 'sw-update-banner';
                banner.innerHTML = `
                  <div style="
                    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
                    background:#20F928; color:#000; padding:12px 24px;
                    border-radius:12px; font-family:Inter,sans-serif; font-size:14px;
                    font-weight:600; z-index:99999; cursor:pointer;
                    box-shadow:0 4px 20px rgba(32,249,40,0.3);
                    display:flex; align-items:center; gap:8px;
                  " onclick="window.location.reload()">
                    ✨ New version available — tap to update
                  </div>
                `;
                document.body.appendChild(banner);
              }
            });
          });
        }).catch((err) => console.warn('[SW] Registration failed:', err));

        // 2. Firebase Messaging SW (background push notifications)
        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        }).then((reg) => {
          console.log('[FCM SW] Registered:', reg.scope);
        }).catch((err) => console.warn('[FCM SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
